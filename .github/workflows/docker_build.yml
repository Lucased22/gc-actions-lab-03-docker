name: Build on DockerHub
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Aguarde (janela para evidencia)
        run: sleep 20

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: false
          load: true
          tags: lucased22/webacademy:latest

      - name: Show built image
        run: docker images

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fazendo deploy
        run: echo "Deploy com sucesso!"